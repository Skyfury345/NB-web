<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Descripción optimizada para que Google muestre exactamente lo que necesitas -->
    <meta name="description" content="NB Logística - Renta de maquinaria pesada y plataformas aéreas en Cancún, Quintana Roo y la Riviera Maya." />

    <!-- Título de pestaña adaptado con tus palabras clave -->
    <title>NB Logística | Renta de Maquinaria Pesada y Plataformas Aéreas</title>

    <!-- Icono del sitio: lo que se ve en la pestaña y en los resultados de Google -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="canonical" href="https://www.grupo-nb.com/" />

    <!-- Cómo se ve el enlace al compartirlo por WhatsApp o Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NB Logística" />
    <meta property="og:title" content="NB Logística | Renta de Maquinaria Pesada y Plataformas Aéreas" />
    <meta property="og:description" content="Renta de maquinaria pesada y plataformas aéreas en Cancún, Quintana Roo y la Riviera Maya. Equipo propio y operadores certificados." />
    <meta property="og:image" content="https://www.grupo-nb.com/logo-nb-completo-600.png" />
    <meta property="og:url" content="https://www.grupo-nb.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />

    <!-- Datos que Google lee para saber qué es este negocio -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NB Logística",
      "alternateName": ["Grupo NB", "NB Logistica"],
      "description": "Renta de maquinaria pesada y transporte de carga con equipo propio, operadores certificados y cobertura en toda la Península de Yucatán.",
      "url": "https://www.grupo-nb.com/",
      "logo": "https://www.grupo-nb.com/favicon-512.png",
      "image": "https://www.grupo-nb.com/logo-nb-completo-600.png",
      "email": "operaciones@grupo-nb.com",
      "areaServed": [
        { "@type": "City", "name": "Cancún" },
        { "@type": "City", "name": "Playa del Carmen" },
        { "@type": "City", "name": "Tulum" },
        { "@type": "State", "name": "Quintana Roo" },
        { "@type": "State", "name": "Yucatán" }
      ],
      "knowsAbout": [
        "Renta de maquinaria pesada",
        "Plataformas aéreas de tijera",
        "Plataformas articuladas",
        "Manipuladores telescópicos",
        "Retroexcavadoras",
        "Camión plataforma",
        "Transporte de carga"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
